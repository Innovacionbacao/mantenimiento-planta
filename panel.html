<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel de órdenes</title>
<link rel="icon" href="./iconos/icono-192.png">
<link rel="apple-touch-icon" href="./iconos/icono-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E7E9E4; --card:#FFFFFF; --ink:#141917; --ink-2:#5C6660;
    --line:#CFD4CD; --line-2:#E4E7E2; --accent:#F0A202; --accent-ink:#3A2900;
    --ok:#2C6E49; --alert:#A62B1F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;font-feature-settings:"tnum" 1;padding-bottom:88px
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .hd{max-width:900px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .hd h1{font-size:18px;font-weight:600;margin:0}
  .cuentas{margin-left:auto;font-size:13px;color:var(--ink-2)}
  .cuentas b{color:var(--ink);font-weight:600}
  .tabs{max-width:900px;margin:0 auto;padding:0 16px;display:flex}
  .tab{flex:0 0 auto;padding:9px 16px 11px;background:none;border:0;border-bottom:2px solid transparent;
    font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;margin:14px 0}
  th{background:#F2F4F1;text-align:left;font-size:12.5px;font-weight:600;padding:10px 12px;white-space:nowrap}
  td{padding:10px 12px;border-top:1px solid var(--line-2);font-size:14px;vertical-align:top}
  tr.sel td{background:#FFFBEE}
  td.num,th.num{text-align:right;white-space:nowrap}
  .eq{font-weight:500}
  .sub{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
  input[type=checkbox]{width:19px;height:19px;accent-color:#24352F}

  .btn{padding:11px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;
    font:inherit;font-weight:500;cursor:pointer}
  .btn.main{background:var(--accent);border-color:#D18F00;color:var(--accent-ink);font-weight:600}
  .btn.peligro{color:var(--alert);border-color:#E4C9C6}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.chico{padding:6px 11px;font-size:13px}

  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(231,233,228,.97);
    border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .barra .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .barra .cuenta{font-size:13.5px;color:var(--ink-2);margin-right:auto}

  .vacio{text-align:center;color:var(--ink-2);padding:44px 16px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;margin:14px 0}
  .nota{font-size:13px;color:var(--ink-2);background:#fff;border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;margin:14px 0}
  .ajustes{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
  .ajustes label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 5px}
  .ajustes input,.ajustes select{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:8px;font:inherit}
  .ficha{position:fixed;inset:0;z-index:70;background:rgba(20,25,23,.5);display:flex;
    align-items:center;justify-content:center;padding:16px}
  .ficha .hoja{background:var(--card);border-radius:12px;width:100%;max-width:620px;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden}
  .ficha .cab{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;
    align-items:center;gap:10px;flex-wrap:wrap}
  .ficha .cab h3{margin:0;font-size:17px;font-weight:600}
  .ficha .cab .x{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;
    color:var(--ink-2);cursor:pointer;padding:2px 6px}
  .ficha .cuerpo{overflow:auto;padding:6px 18px 18px}
  .ficha .pie{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;flex-wrap:wrap}
  .campo{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:8px 0;
    border-bottom:1px solid var(--line-2);font-size:14px}
  .campo .k{color:var(--ink-2);font-size:13px}
  .campo .v{white-space:pre-wrap;word-break:break-word}
  .campo .v.vacio{color:#A9B1AB}
  .grupo{font-size:12px;font-weight:600;color:var(--ink-2);margin:16px 0 2px;
    text-transform:none;letter-spacing:.02em}
  @media (max-width:560px){ .campo{grid-template-columns:1fr;gap:2px;padding:7px 0} }

  .navApp{display:flex;gap:4px;align-items:center;font-size:12.5px;margin-left:auto}
  .navApp a{color:var(--ink-2);text-decoration:none;padding:4px 9px;border-radius:6px;
    border:1px solid transparent}
  .navApp a:hover{background:#EDEFEB}
  .navApp a[aria-current="page"]{color:var(--ink);font-weight:600;border-color:var(--line);background:#fff}

  .marca{display:flex;align-items:center;gap:10px}
  .marca img{height:30px;width:auto;display:block}
  .credito{max-width:900px;margin:26px auto 0;padding:14px 16px 26px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-2);text-align:center}
  .credito b{font-weight:500;color:var(--ink)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;z-index:50;background:var(--ink);
    color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .2s ease;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .cargando{text-align:center;color:var(--ink-2);padding:40px}
  body.bloqueado>header,body.bloqueado>main,body.bloqueado>.barra{display:none}
  .puerta{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;
    justify-content:center;padding:24px}
  body.bloqueado .puerta{display:flex}
  .puerta .caja{width:100%;max-width:320px;text-align:center}
  .puerta h2{font-size:19px;margin:0 0 6px}
  .puerta p{color:var(--ink-2);font-size:14px;margin:0 0 20px}
  .puerta input{width:100%;text-align:center;font-size:26px;letter-spacing:.4em;padding:14px;
    border:1px solid var(--line);border-radius:10px}
  .puerta .btn{width:100%;margin-top:12px}
  .puerta .aviso{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--alert)}
</style>

<div class="puerta" id="puerta">
  <div class="caja">
    <h2>Panel de órdenes</h2>
    <p>Escribe el código para entrar</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="······">
    <button class="btn main" id="btnEntrar" type="button">Entrar</button>
    <div class="aviso" id="avisoPin"></div>
  </div>
</div>

<header>
  <div class="hd">
    <div class="marca"><img src="./bacao.svg" alt="Bacao"><h1>Panel de órdenes</h1></div>
    <div class="cuentas" id="cuentas">…</div>
    <nav class="navApp">
      <a href="./index.html">Órdenes</a>
      <a href="./panel.html" aria-current="page">Panel</a>
      <a href="./tablero.html">Tablero</a>
    </nav>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabPend" role="tab" aria-selected="true">Por consolidar</button>
    <button class="tab" id="tabAb" role="tab" aria-selected="false">En curso</button>
    <button class="tab" id="tabPap" role="tab" aria-selected="false">Papelera</button>
    <button class="tab" id="tabCat" role="tab" aria-selected="false">Catálogo</button>
    <button class="tab" id="tabPrev" role="tab" aria-selected="false">Preventivo</button>
    <button class="tab" id="tabConf" role="tab" aria-selected="false">Ajustes</button>
  </div>
</header>

<main class="wrap">
  <div id="vista"><div class="cargando">Cargando…</div></div>
</main>

<div class="barra" id="barra">
  <div class="in">
    <span class="cuenta" id="cuenta">0 seleccionadas</span>
    <button class="btn" id="btnCopiar" type="button">Copiar para Excel</button>
    <button class="btn peligro" id="btnPapelera" type="button">A la papelera</button>
    <button class="btn main" id="btnConsolidar" type="button">Marcar consolidadas</button>
    <button class="btn main" id="btnListas" type="button">Marcar listas</button>
    <button class="btn" id="btnRestaurar" type="button">Restaurar</button>
    <button class="btn peligro" id="btnEliminar" type="button">Eliminar definitivo</button>
  </div>
</div>

<div class="ficha" id="ficha" style="display:none">
  <div class="hoja">
    <div class="cab">
      <h3 id="fichaTitulo">Orden</h3>
      <span id="fichaEstado" class="badge"></span>
      <button class="x" id="fichaCerrar" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="cuerpo" id="fichaCuerpo"></div>
    <div class="pie" id="fichaPie"></div>
  </div>
</div>

<div class="credito">
  Seguimiento de mantenimiento · Planta Bacao<br>

const KEY_ACC = "bacao:acceso:v1";
const KEY_CFG = "bacao:panel:v1";

const $ = s => document.querySelector(s);
let cfg = { servidor: "", dec: "," };
let datos = [];          // lo que se está mostrando
let sel = new Set();

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
const base = () => (cfg.servidor || SERVIDOR).replace(/\/+$/,"");
const url = (ruta, extra="") => base() + ruta + "?k=" + encodeURIComponent(CLAVE_SERVIDOR) + extra;

function hash(s){ let x=5381; for(const c of s) x=((x*33)^c.charCodeAt(0))>>>0; return x; }
function leerCfg(){ try{ Object.assign(cfg, JSON.parse(localStorage.getItem(KEY_CFG)||"{}")); }catch(e){} }
function guardarCfg(){ try{ localStorage.setItem(KEY_CFG, JSON.stringify(cfg)); }catch(e){} }

/* ---------- acceso ---------- */
function acceso(){
  let ok=false; try{ ok = localStorage.getItem(KEY_ACC)==="1"; }catch(e){}
  if(ok) return true;
  document.body.classList.add("bloqueado");
  const inp=$("#pin"), av=$("#avisoPin");
  const probar=()=>{
    if(hash(inp.value.trim())===PIN_HASH){
      try{ localStorage.setItem(KEY_ACC,"1"); }catch(e){}
      document.body.classList.remove("bloqueado"); arrancar();
    }else{ av.textContent="Código incorrecto"; inp.value=""; inp.focus(); }
  };
  $("#btnEntrar").onclick=probar;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") probar(); });
  setTimeout(()=>inp.focus(),100);
  return false;
}

/* ---------- servicio ---------- */
async function pedir(ruta, extra=""){
  if(!base()) throw new Error("falta la dirección del servicio");
  const r = await fetch(url(ruta, extra));
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ("error " + r.status));
  return d;
}
async function refrescarCuentas(){
  try{
    const s = await pedir("/salud");
    $("#cuentas").innerHTML = `<b>${s.pendientes}</b> por consolidar · ${s.abiertas ?? 0} en curso · ${s.consolidadas} consolidadas · ${s.en_papelera} en papelera`;
  }catch(e){ $("#cuentas").textContent = e.message; }
}

/* ---------- tabla ---------- */
function fmt(r){
  return `<tr data-ot="${r.ot}" class="${sel.has(r.ot)?"sel":""}">
    <td><input type="checkbox" data-ck="${r.ot}" ${sel.has(r.ot)?"checked":""}></td>
    <td class="num">${r.ot}</td>
    <td>${r.fecha||""}<span class="sub">${r.capturado_por||"sin nombre"}</span></td>
    <td><span class="eq">${r.equipo||""}</span><span class="sub">${r.trabajo||""}</span></td>
    <td>${r.interv||""}<span class="sub">${r.estado||"sin estado"}</span></td>
    <td class="num">${r.tiempo||""}</td>
    <td class="num"><button class="btn chico" data-ver="${r.ot}">Ver</button></td>
  </tr>`;
}
function pintar(){
  const v = $("#vista");
  if(pestana==="conf"){ pintarAjustes(); return; }
  if(pestana==="cat"){ pintarCatalogo(); return; }
  if(pestana==="prev"){ pintarPreventivo(); return; }
  if(!datos.length){
    v.innerHTML = `<div class="vacio">${pestana==="pend"
      ? "No hay órdenes por consolidar. Todo lo capturado ya pasó al Excel."
      : "La papelera está vacía."}</div>`;
    $("#barra").style.display = "none";
    actualizarCuenta(); return;
  }
  $("#barra").style.display = "";
  v.innerHTML = `<table><thead><tr>
      <th><input type="checkbox" id="ckTodo"></th><th class="num">OT</th><th>Fecha</th>

      o Eliminar definitivo para borrarlas de verdad. Lo eliminado no se recupera.</div>` : ""}
    ${pestana==="ab" ? `<div class="nota">Órdenes que el operario dejó abiertas porque el trabajo sigue
      en curso. No entran al Excel hasta que estén listas.</div>` : ""}`;

  v.querySelectorAll("[data-ver]").forEach(b => b.onclick = e => {
    e.stopPropagation(); abrirFicha(Number(b.dataset.ver));
  });
  v.querySelectorAll("[data-ck]").forEach(c => c.onchange = () => {
    const ot = Number(c.dataset.ck);
    c.checked ? sel.add(ot) : sel.delete(ot);
    c.closest("tr").classList.toggle("sel", c.checked);
    actualizarCuenta();
  });
  const todo = v.querySelector("#ckTodo");
  if(todo) todo.onchange = () => {
    sel = todo.checked ? new Set(datos.map(r=>r.ot)) : new Set();
    pintar();
  };

  actualizarCuenta();
}

  ab:   ["btnListas","btnPapelera"],
  pap:  ["btnRestaurar","btnEliminar"],
};
function actualizarCuenta(){
  const n = sel.size;
  $("#cuenta").textContent = n === 1 ? "1 seleccionada" : n + " seleccionadas";
  const visibles = BOTONES[pestana] || [];

/* ---------- preventivo ---------- */
function partirCsv(txt){
  const limpio = txt.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").trim();
  const primera = limpio.split("\n")[0];
  const sep = [";", ",", "\t"].sort((a,b) =>
    primera.split(b).length - primera.split(a).length)[0];
  const filas = [];
  let campo = "", fila = [], comillas = false;
  for(let i = 0; i < limpio.length; i++){
    const c = limpio[i];
    if(comillas){
      if(c === '"' && limpio[i+1] === '"'){ campo += '"'; i++; }
      else if(c === '"') comillas = false;
      else campo += c;
    }else if(c === '"') comillas = true;
    else if(c === sep){ fila.push(campo); campo = ""; }
    else if(c === "\n"){ fila.push(campo); filas.push(fila); fila = []; campo = ""; }
    else campo += c;
  }
  fila.push(campo); if(fila.length > 1 || fila[0]) filas.push(fila);
  return filas.map(f => f.map(x => x.trim()));
}

/* Del CSV de horómetros: una fila por medición, una columna por equipo.
   Las columnas de control (id, usuario, fecha, hora) se reconocen por nombre. */
function leerCsvHorometros(txt){
  const filas = partirCsv(txt);
  if(filas.length < 2) throw new Error("el archivo no tiene filas de datos");
  const enc = filas[0];
  const control = /^(id|usuario|user|fecha|hora|folio|estatus|status)/i;
  const iFecha = enc.findIndex(h => /fecha/i.test(h));
  const iUsuario = enc.findIndex(h => /usuario|user/i.test(h));
  const equipos = enc.map((h,i) => ({h, i})).filter(x => x.h && !control.test(x.h));
  if(!equipos.length) throw new Error("no se reconocieron columnas de equipos");
  const norm = f => {
    if(!f) return "";
    const m = f.match(/(\d{1,4})[\/-](\d{1,2})[\/-](\d{1,4})/);
    if(!m) return f;
    return m[1].length === 4 ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`
                             : `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  };
  const mediciones = [];
  for(let r = 1; r < filas.length; r++){
    const f = filas[r];
    if(!f.some(x => x)) continue;
    const valores = {};
    equipos.forEach(e => {
      const v = (f[e.i] || "").replace(/\s/g,"").replace(",", ".");
      if(v !== "" && !isNaN(Number(v))) valores[e.h] = Number(v);
    });
    if(Object.keys(valores).length)
      mediciones.push({fecha: norm(iFecha >= 0 ? f[iFecha] : ""),
                       usuario: iUsuario >= 0 ? f[iUsuario] : "", valores});
  }
  if(!mediciones.length) throw new Error("no se leyó ninguna medición con números");
  return {mediciones, equipos: equipos.map(e => e.h)};
}

      así que no aparecen en Por consolidar; sirven para el histórico y las estadísticas.
      Si lo repites, las que ya estén se omiten: no se duplica nada.</p>
    <input type="file" id="a_hist" accept=".json,application/json">
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
      <button class="btn main" id="btnHist" type="button" disabled>Cargar histórico</button>
      <span id="progHist" style="font-size:13px;color:var(--ink-2)"></span>
    </div>
  </div>
  <div class="nota">El panel no guarda órdenes: todo vive en el servicio. Puedes abrirlo
    desde cualquier computador o celular con el código de acceso.</div>`;
  $("#a_srv").onchange = e => { cfg.servidor = e.target.value.trim(); guardarCfg(); cargar(); };
  $("#a_dec").onchange = e => { cfg.dec = e.target.value; guardarCfg(); };
  $("#a_sinot").onchange = e => { cfg.sinOt = e.target.value === "si"; guardarCfg(); };

  pedir("/espacio").then(e => {
    $("#espacio").innerHTML = `<b style="color:var(--ink)">${e.ordenes}</b> órdenes ocupando
      <b style="color:var(--ink)">${e.kb} KB</b> de ${e.limite_plan_gratuito_mb} MB disponibles.
      ${e.consolidadas} ya consolidadas, archivables hasta la OT ${e.mayor_ot_consolidada}.
      Por año: ${Object.entries(e.por_anio).map(([a,n]) => a + ": " + n).join(" · ")}.`;
    $("#a_hastaOt").value = e.mayor_ot_consolidada;
  }).catch(err => { $("#espacio").textContent = "No se pudo consultar: " + err.message; });

  $("#btnPurgar").onclick = async () => {
    const hasta = Number($("#a_hastaOt").value);
    if(!hasta){ toast("Escribe hasta qué número de OT"); return; }
    if(!confirm(`Primero se descarga un respaldo con TODO el histórico.\n\n` +
                `Después se borrarán del servicio las órdenes consolidadas hasta la OT ${hasta}. ` +
                `Seguirán en tu Excel y en el respaldo, pero no en el tablero ni en el panel.\n\n¿Sigues?`)) return;
    try{
      const r = await fetch(url("/registros", "&estado=todas"));
      const lista = await r.json();
      const cab = ["OT","Fecha","Equipo","Area","Tipo de intervencion","Proveedor","Tipo de trabajo",
        "Informacion adicional","Fecha de programacion","Semana de programacion","Estado","Horometro",
        "Tiempo del mantenimiento","Num mecanicos","Horas mtto mecanico","Num auxiliares",
        "Horas mtto auxiliar","Fecha finalizacion","Semana finalizacion","Disenos","Pedido de materiales",
        "Llegada materiales","Insumo","Costo","Capturado por","Recibido"];
      const campos = ["ot","fecha","equipo","area","interv","prov","trabajo","info","prog","semprog",
        "estado","horom","tiempo","nmec","hmec","naux","haux","fin","semfin","dis","ped","lle","ins",
        "costo","capturado_por","recibido"];
      const esc = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
      const csv = "\uFEFF" + [cab.join(";")].concat(
        lista.map(o => campos.map(c => esc(o[c])).join(";"))).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
      a.download = `respaldo_antes_de_archivar_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      await new Promise(res => setTimeout(res, 1200));
      if(!confirm("¿Se descargó el respaldo? Solo continúa si lo tienes guardado.")) return;
      const d = await pedir("/purgar", "&hasta=" + hasta + "&confirmar=si");
      toast(`${d.borradas} órdenes archivadas. Quedan ${d.quedan}.`);
      pintarAjustes();
    }catch(err){ toast(err.message); }
  };

  let archivoHist = null;
  $("#a_hist").onchange = e => {
    archivoHist = e.target.files[0] || null;
    $("#btnHist").disabled = !archivoHist;
    $("#progHist").textContent = archivoHist ? archivoHist.name : "";
  };
  $("#btnHist").onclick = async () => {
    if(!archivoHist) return;
    let lote;
    try{
      const txt = await archivoHist.text();
      const d = JSON.parse(txt);
      lote = Array.isArray(d) ? d : d.ordenes;
      if(!Array.isArray(lote) || !lote.length) throw new Error("el archivo no trae órdenes");
    }catch(err){ toast("No se pudo leer: " + err.message); return; }
    if(!confirm(`¿Cargar ${lote.length} órdenes del histórico al servicio?`)) return;

    const btn = $("#btnHist"); btn.disabled = true;
    let guardadas = 0, omitidas = 0;
    for(let i = 0; i < lote.length; i += 100){
      $("#progHist").textContent = `Enviando ${Math.min(i+100, lote.length)} de ${lote.length}…`;
      try{
        const r = await fetch(url("/importar", "&confirmar=si"), { method:"POST",
          headers:{"Content-Type":"application/json"}, body: JSON.stringify({ordenes: lote.slice(i, i+100)}) });
        const d = await r.json();
        if(!r.ok || !d.ok) throw new Error(d.error || "error " + r.status);
        guardadas += d.guardadas; omitidas += d.omitidas;
      }catch(err){
        $("#progHist").textContent = "Se detuvo: " + err.message;
        btn.disabled = false; return;
      }
    }
    $("#progHist").textContent = `Listo: ${guardadas} cargadas, ${omitidas} ya estaban.`;
    btn.disabled = false;
    refrescarCuentas();
  };
  pedir("/salud").then(s => { $("#a_cont").value = s.proxima_ot; }).catch(()=>{});
  $("#btnCont").onclick = async () => {
    const v = Number($("#a_cont").value);
    if(!v){ toast("Escribe un número"); return; }
    if(!confirm("¿La próxima orden que se registre llevará el número " + v + "?")) return;
    try{
      const r = await pedir("/contador", "&valor=" + v + "&confirmar=si");
      toast("Listo: la próxima será la OT " + r.proxima_ot);
      refrescarCuentas();
    }catch(e){ toast(e.message); }
  };
}

/* ---------- ficha de una orden ---------- */
const ETIQUETAS = [
  ["Del trabajo", [["fecha","Fecha de creación"],["equipo","Equipo"],["area","Área"],
    ["interv","Tipo de intervención"],["prov","Proveedor"],["trabajo","Tipo de trabajo"],
    ["info","Información adicional"]]],
  ["Programación", [["prog","Fecha programada"],["semprog","Semana de programación"],["estado","Estado"]]],
  ["Ejecución", [["horom","Horómetro"],["tiempo","Duración (h)"],["nmec","Nº de mecánicos"],
    ["hmec","Horas de mecánico"],["naux","Nº de auxiliares"],["haux","Horas de auxiliar"],
    ["fin","Fecha de finalización"],["semfin","Semana de finalización"]]],
  ["Materiales", [["dis","Diseños"],["ped","Pedido de materiales"],["lle","Llegada de materiales"],
    ["ins","Insumo"],["costo","Costo"]]],
  ["Registro", [["capturado_por","Capturado por"],["recibido","Recibido el"],["editado","Última edición"],
    ["consolidado_el","Consolidada el"]]],
];

function abrirFicha(ot){
  const r = datos.find(x => x.ot === ot);
  if(!r) return;
  const etapa = r.borrado ? "En la papelera"
              : r.consolidado ? "Consolidada"
              : r.lista === false ? "En curso" : "Lista por consolidar";
  $("#fichaTitulo").textContent = "OT " + r.ot;
  $("#fichaEstado").textContent = etapa;
  $("#fichaEstado").className = "badge" + (r.consolidado ? " ok" : "");

  $("#fichaCuerpo").innerHTML = ETIQUETAS.map(([grupo, campos]) => {
    const filas = campos.map(([c, et]) => {
      const v = r[c];
      return `<div class="campo"><span class="k">${et}</span>
        <span class="v ${v===""||v==null?"vacio":""}">${v===""||v==null?"sin dato":String(v)}</span></div>`;
    }).join("");
    return `<div class="grupo">${grupo}</div>${filas}`;
  }).join("");

  const btn = (id, txt, clase="btn") => `<button class="${clase}" data-fa="${id}">${txt}</button>`;
  let acciones = "";
  if(!r.borrado && !r.consolidado && r.lista !== false)
    acciones += btn("consolidar","Marcar consolidada","btn main") + btn("reabrir","Devolver a En curso");
  if(!r.borrado && r.lista === false) acciones += btn("lista","Marcar lista","btn main");
  if(!r.borrado && !r.consolidado) acciones += btn("papelera","A la papelera","btn peligro");
  if(r.borrado) acciones += btn("restaurar","Restaurar","btn main");
  acciones += btn("copiar","Copiar esta fila");
  $("#fichaPie").innerHTML = acciones;

  $("#fichaPie").querySelectorAll("[data-fa]").forEach(b => b.onclick = () => accionFicha(b.dataset.fa, r));
  $("#ficha").style.display = "flex";
}
function cerrarFicha(){ $("#ficha").style.display = "none"; }

async function accionFicha(que, r){
  if(que === "copiar"){
    const cols = cfg.sinOt ? COLS.filter(c => c !== "ot") : COLS;
    const fila = cols.map(c => {
      let v = r[c] ?? "";
      if(DECIMALES.has(c) && v !== "" && cfg.dec === ",") v = String(v).replace(".", ",");
      return String(v).replace(/[\t\n\r]+/g, " ");
    }).join("\t");
    try{ await navigator.clipboard.writeText(fila); toast("Fila copiada"); }
    catch(e){ toast("El navegador bloqueó el portapapeles"); }
    return;
  }
  const mapa = {
    consolidar: ["/consolidar", "¿Marcar la OT " + r.ot + " como ya pasada al Excel?", true],
    papelera:   ["/borrar", "¿Mandar la OT " + r.ot + " a la papelera?", true],
    restaurar:  ["/restaurar", "¿Devolver la OT " + r.ot + " a la lista?", false],
    lista:      ["/marcar-lista", "¿Dar por terminada la OT " + r.ot + "?", true],
    reabrir:    ["/reabrir", "¿Devolver la OT " + r.ot + " a En curso?", true],
  }[que];
  if(!mapa) return;
  const [ruta, texto, confirmar] = mapa;
  if(!confirm(texto)) return;
  try{
    await pedir(ruta, "&ot=" + r.ot + (confirmar ? "&confirmar=si" : ""));
    toast("OT " + r.ot + " actualizada");
    cerrarFicha(); await cargar();
  }catch(e){ toast(e.message); }
}

/* ---------- acciones ---------- */
const COLS = ["ot","fecha","equipo","area","interv","prov","trabajo","info","prog","semprog",
              "estado","horom","tiempo","nmec","hmec","naux","haux","fin","semfin",
              "dis","ped","lle","ins","costo"];
const DECIMALES = new Set(["horom","tiempo","hmec","haux","costo"]);

async function copiar(){
  const cols = cfg.sinOt ? COLS.filter(c => c !== "ot") : COLS;
  const filas = datos.filter(r => sel.has(r.ot)).map(r =>
    cols.map(c => {
      let v = r[c] ?? "";
      if(DECIMALES.has(c) && v !== "" && cfg.dec === ",") v = String(v).replace(".", ",");
      return String(v).replace(/[\t\n\r]+/g, " ");
    }).join("\t")).join("\n");
  try{
    await navigator.clipboard.writeText(filas);
    toast(sel.size + " fila(s) copiadas. Pega en la columna " + (cfg.sinOt ? "C" : "B") + " de la hoja Trabajos.");
  }catch(e){ toast("El navegador bloqueó el portapapeles; usa el CSV del servicio"); }
}

async function accion(ruta, texto, pideConfirmar = true){
  const ots = [...sel];
  if(!ots.length) return;
  if(!confirm(texto.replace("{n}", ots.length))) return;
  let ok = 0, fallo = 0, ultimo = "";
  for(const ot of ots){
    try{ await pedir(ruta, "&ot=" + ot + (pideConfirmar ? "&confirmar=si" : "")); ok++; }
    catch(e){ fallo++; ultimo = e.message; }
  }
  sel.clear();
  toast(fallo ? ok + " listas, " + fallo + " con error (" + ultimo + ")" : ok + " orden(es) actualizadas");
  await cargar();
}


/* ---------- carga ---------- */
async function cargar(){
  if(pestana === "conf"){ pintarAjustes(); return; }
  if(pestana === "cat"){ pintarCatalogo(); return; }
  if(pestana === "prev"){ pintarPreventivo(); return; }
  $("#vista").innerHTML = `<div class="cargando">Cargando…</div>`;
  try{
    datos = pestana === "pend" ? await pedir("/registros")
          : pestana === "ab"   ? await pedir("/registros", "&estado=abiertas")
          :                      await pedir("/papelera");
    datos.sort((a,b) => a.ot - b.ot);
    sel = new Set([...sel].filter(ot => datos.some(r => r.ot === ot)));
    pintar();
    refrescarCuentas();
  }catch(e){
    $("#vista").innerHTML = `<div class="vacio">No se pudo conectar con el servicio.<br><br>
      ${e.message}<br><br>Revisa la dirección en Ajustes.</div>`;
    $("#barra").style.display = "none";
  }
}
function ir(p){
  pestana = p; sel.clear();
  $("#tabPend").setAttribute("aria-selected", p==="pend");
  $("#tabAb").setAttribute("aria-selected", p==="ab");
  $("#tabPap").setAttribute("aria-selected", p==="pap");
  $("#tabCat").setAttribute("aria-selected", p==="cat");
  $("#tabPrev").setAttribute("aria-selected", p==="prev");
  $("#tabConf").setAttribute("aria-selected", p==="conf");
  cargar();
}

function arrancar(){
  $("#btnListas").onclick = () => accion("/marcar-lista",
    "¿Dar por terminadas {n} orden(es)? Pasarán a la lista por consolidar.");
  $("#btnRestaurar").onclick = () => accion("/restaurar",
    "¿Devolver {n} orden(es) a la lista?", false);
  $("#btnEliminar").onclick = () => accion("/eliminar",
    "Vas a borrar {n} orden(es) de forma definitiva. Esto no se puede deshacer. ¿Sigues?");
  leerCfg();
  $("#tabPend").onclick = () => ir("pend");
  $("#tabAb").onclick   = () => ir("ab");
  $("#tabPap").onclick  = () => ir("pap");
  $("#tabCat").onclick  = () => ir("cat");
  $("#tabPrev").onclick = () => ir("prev");
  $("#fichaCerrar").onclick = cerrarFicha;
  $("#ficha").onclick = e => { if(e.target.id === "ficha") cerrarFicha(); };
  document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarFicha(); });
  $("#tabConf").onclick = () => ir("conf");
  $("#btnCopiar").onclick = copiar;
  $("#btnConsolidar").onclick = () => accion("/consolidar",
    "¿Marcar {n} orden(es) como ya pasadas al Excel? Dejarán de aparecer en la lista.");
  $("#btnPapelera").onclick = () => accion("/borrar",
    "¿Mandar {n} orden(es) a la papelera? Se pueden restaurar después.");
  cargar();
}

leerCfg();
if(acceso()) arrancar();
</script>
