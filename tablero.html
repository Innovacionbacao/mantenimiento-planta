<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tablero de mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E7E9E4; --card:#FFFFFF; --ink:#141917; --ink-2:#5C6660;
    --line:#CFD4CD; --line-2:#E4E7E2; --accent:#F0A202;
    --verde:#24352F; --salvia:#5C7C71; --ok:#2C6E49; --alerta:#A62B1F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;font-feature-settings:"tnum" 1}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
  header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
  .hd{max-width:980px;margin:0 auto;padding:14px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .hd h1{font-size:18px;font-weight:600;margin:0}
  .hd .sub{font-size:13px;color:var(--ink-2)}
  .hd .der{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;
    font:inherit;font-size:13.5px;cursor:pointer}
  .btn[aria-pressed="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px;align-items:center}
  .filtros .sep{flex:1}
  .filtros input[type=date]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .kpi .n{font-size:26px;font-weight:600;line-height:1.15}
  .kpi .t{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .kpi .p{font-size:12px;color:var(--ink-2);margin-top:6px}

  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){ .rejilla{grid-template-columns:1fr} }
  .caja{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
  .caja h2{font-size:14px;font-weight:600;margin:0 0 12px}
  .caja.ancha{grid-column:1 / -1}

  .barra-fila{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
  .barra-fila .et{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pista{height:8px;background:#EDEFEB;border-radius:5px;overflow:hidden;margin-top:4px}
  .relleno{height:100%;background:var(--verde);border-radius:5px}
  .relleno.s{background:var(--salvia)}
  .relleno.a{background:var(--accent)}
  .val{text-align:right;color:var(--ink-2);font-size:12.5px}

  .meses{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:6px}
  .mes{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
  .mes .col{width:100%;background:var(--verde);border-radius:3px 3px 0 0;min-height:2px}
  .mes .lb{font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
  .mes .vv{font-size:10.5px;color:var(--ink-2)}

  .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;align-items:center}
  .ctrl select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px}
  .ctrl .et{font-size:12.5px;color:var(--ink-2)}
  .resumen80{background:#F5F7F3;border:1px solid var(--line-2);border-radius:8px;
    padding:10px 12px;margin-top:12px;font-size:13.5px}
  .resumen80 b{font-weight:600}
  svg .ejeTxt{font-size:9.5px;fill:#5C6660}
  svg .grid{stroke:#EDEFEB;stroke-width:1}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 8px;border-bottom:1px solid var(--line-2)}
  td{padding:7px 8px;border-bottom:1px solid var(--line-2)}
  td.n,th.n{text-align:right;white-space:nowrap}
  .cargando,.vacio{text-align:center;color:var(--ink-2);padding:50px 16px}

  [data-bolsa]{cursor:pointer}
  .kpi[data-bolsa]:hover,.barra-fila[data-bolsa]:hover,tr[data-bolsa]:hover{background:#F5F7F3}
  .lupa{font-size:11px;color:var(--ink-2);margin-left:5px}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(20,25,23,.5);display:none;
    align-items:center;justify-content:center;padding:16px}
  .modal.abierto{display:flex}
  .modal .hoja{background:var(--card);border-radius:12px;width:100%;max-width:680px;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden}
  .modal .cab{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center}
  .modal .cab h3{margin:0;font-size:16px;font-weight:600}
  .modal .cab .x{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;
    color:var(--ink-2);cursor:pointer;padding:2px 6px}
  .modal .cuerpo{overflow:auto;padding:8px 18px 18px}
  .orden{border-bottom:1px solid var(--line-2);padding:11px 0}
  .orden .l1{display:flex;gap:8px;align-items:baseline;font-size:14px}
  .orden .l1 b{font-weight:600}
  .orden .l1 .der{margin-left:auto;color:var(--ink-2);font-size:12.5px}
  .orden .eq{font-size:13.5px;margin-top:2px}
  .orden .desc{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
  .orden .mas{font-size:12.5px;color:var(--ink-2);margin-top:6px;display:none}
  .orden.abierta .mas{display:block}
  .orden .mas span{display:inline-block;margin-right:14px}
  body.bloqueado>header,body.bloqueado>main{display:none}
  .puerta{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
  body.bloqueado .puerta{display:flex}
  .puerta .caja2{width:100%;max-width:320px;text-align:center}
  .puerta h2{font-size:19px;margin:0 0 6px}
  .puerta p{color:var(--ink-2);font-size:14px;margin:0 0 20px}
  .puerta input{width:100%;text-align:center;font-size:26px;letter-spacing:.4em;padding:14px;
    border:1px solid var(--line);border-radius:10px}
  .puerta .btn{width:100%;margin-top:12px;padding:13px;background:var(--accent);border-color:#D18F00;font-weight:600}
  .aviso{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--alerta)}
</style>

<div class="puerta" id="puerta">
  <div class="caja2">
    <h2>Tablero de mantenimiento</h2>
    <p>Escribe el código para entrar</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="······">
    <button class="btn" id="btnEntrar" type="button">Entrar</button>
    <div class="aviso" id="avisoPin"></div>
  </div>
</div>

<header>
  <div class="hd">
    <h1>Tablero de mantenimiento</h1>
    <span class="sub" id="periodo">—</span>
    <div class="der">
      <span class="sub" id="sello"></span>
      <button class="btn" id="btnExpPeriodo" type="button">Exportar período</button>
      <button class="btn" id="btnExpTodo" type="button">Respaldo completo</button>
      <button class="btn" id="btnRecargar" type="button">Actualizar</button>
    </div>
  </div>
</header>

<div class="modal" id="modal">
  <div class="hoja">
    <div class="cab"><h3 id="modalTitulo">Órdenes</h3>
      <button class="x" id="modalCerrar" type="button" aria-label="Cerrar">×</button></div>
    <div class="cuerpo" id="modalCuerpo"></div>
  </div>
</div>

<main class="wrap">
  <div class="filtros" id="filtros">
    <button class="btn" data-rango="30">Últimos 30 días</button>
    <button class="btn" data-rango="90">Últimos 3 meses</button>
    <button class="btn" data-rango="365">Últimos 12 meses</button>
    <button class="btn" data-rango="0">Todo</button>
    <span class="sep"></span>
    <input type="date" id="f_desde"><input type="date" id="f_hasta">
  </div>
  <div class="ctrl" style="margin:14px 0 0">
    <button class="btn" id="v_resumen" aria-pressed="true">Resumen</button>
    <button class="btn" id="v_indic" aria-pressed="false">Indicadores</button>
  </div>
  <div id="cuerpo"><div class="cargando">Cargando…</div></div>
</main>

<script>
const SERVIDOR = "https://ordenes-bacao.mgereda.workers.dev";
const CLAVE_SERVIDOR = "2MWpGyZcdUQqMTSgiHXAo5gx";
const PIN_HASH = 3821502243;
const KEY_ACC = "bacao:acceso:v1";

const $ = s => document.querySelector(s);
let todas = [], desde = null, hasta = null, rangoActivo = 365;

function hash(s){ let x=5381; for(const c of s) x=((x*33)^c.charCodeAt(0))>>>0; return x; }
const nf = n => (Math.round(n*10)/10).toLocaleString("es-CO");
const ni = n => Math.round(n).toLocaleString("es-CO");
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function aFecha(s){
  if(!s) return null;
  const p = String(s).split("/");
  if(p.length !== 3) return null;
  const d = new Date(+p[2], +p[1]-1, +p[0]);
  return isNaN(d) ? null : d;
}
const numero = v => {
  if(v === "" || v == null) return 0;
  const n = parseFloat(String(v).replace(",", "."));
  return isNaN(n) ? 0 : n;
};
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);

/* ---------- acceso ---------- */
function acceso(){
  let ok = false; try{ ok = localStorage.getItem(KEY_ACC) === "1"; }catch(e){}
  if(ok) return true;
  document.body.classList.add("bloqueado");
  const inp = $("#pin");
  const probar = () => {
    if(hash(inp.value.trim()) === PIN_HASH){
      try{ localStorage.setItem(KEY_ACC,"1"); }catch(e){}
      document.body.classList.remove("bloqueado"); arrancar();
    }else{ $("#avisoPin").textContent = "Código incorrecto"; inp.value = ""; }
  };
  $("#btnEntrar").onclick = probar;
  inp.onkeydown = e => { if(e.key === "Enter") probar(); };
  setTimeout(()=>inp.focus(), 100);
  return false;
}

/* ---------- datos ---------- */
async function traer(){
  $("#cuerpo").innerHTML = `<div class="cargando">Cargando…</div>`;
  try{
    const r = await fetch(SERVIDOR + "/registros?k=" + encodeURIComponent(CLAVE_SERVIDOR) + "&estado=todas");
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "error " + r.status);
    todas = d.map(o => ({...o, _f: aFecha(o.fin) || aFecha(o.fecha), _h: numero(o.tiempo)}));
    $("#sello").textContent = "al " + new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
    pintar();
  }catch(e){
    $("#cuerpo").innerHTML = `<div class="vacio">No se pudo conectar con el servicio.<br><br>${e.message}</div>`;
  }
}

function enRango(o){
  if(!o._f) return false;
  if(desde && o._f < desde) return false;
  if(hasta && o._f > hasta) return false;
  return true;
}

/* ---------- ver las órdenes detrás de cada número ---------- */
let bolsas = new Map(), nBolsa = 0;
function bolsa(ordenes, titulo){
  const id = "b" + (++nBolsa);
  bolsas.set(id, {ordenes, titulo});
  return id;
}
function marca(ordenes, titulo){
  return ordenes && ordenes.length ? ` data-bolsa="${bolsa(ordenes, titulo)}"` : "";
}

function abrirBolsa(id){
  const b = bolsas.get(id);
  if(!b || !b.ordenes.length) return;
  const lista = b.ordenes.slice().sort((a,c) => (aFecha(c.fin)||aFecha(c.fecha)||0) - (aFecha(a.fin)||aFecha(a.fecha)||0));
  $("#modalTitulo").textContent = b.titulo + " · " + lista.length + (lista.length === 1 ? " orden" : " órdenes");
  $("#modalCuerpo").innerHTML = lista.map(o => `
    <div class="orden" data-ot="${o.ot}">
      <div class="l1"><b>OT ${o.ot}</b><span>${o.fecha || ""}</span>
        <span class="der">${o._h ? nf(o._h) + " h" : "sin horas"} · ${o.estado || "sin estado"}</span></div>
      <div class="eq">${o.equipo || ""} — ${o.interv || ""}</div>
      <div class="desc">${o.trabajo ? "<b>" + o.trabajo + ".</b> " : ""}${o.info || "Sin descripción"}</div>
      <div class="mas">
        <span>Área: ${o.area || "—"}</span><span>Proveedor: ${o.prov || "—"}</span>
        <span>Programada: ${o.prog || "—"}</span><span>Finalizada: ${o.fin || "—"}</span>
        <span>Mecánicos: ${o.nmec || "—"}</span><span>Horas mecánico: ${o.hmec || "—"}</span>
        <span>Capturó: ${o.capturado_por || "—"}</span>
      </div>
    </div>`).join("");
  $("#modalCuerpo").querySelectorAll(".orden").forEach(el =>
    el.onclick = () => el.classList.toggle("abierta"));
  $("#modal").classList.add("abierto");
}
function cerrarModal(){ $("#modal").classList.remove("abierto"); }

function enlazarBolsas(){
  document.querySelectorAll("[data-bolsa]").forEach(el =>
    el.onclick = e => { e.stopPropagation(); abrirBolsa(el.dataset.bolsa); });
}

/* ---------- piezas visuales ---------- */
function barras(datos, clase, formato = nf, detalle = null, titulo = ""){
  const max = Math.max(...datos.map(d => d[1]), 1);
  return datos.map(([et, v]) => {
    const ord = detalle ? detalle(et) : null;
    const m = ord ? marca(ord, titulo ? titulo + ": " + et : et) : "";
    return `<div${m}>
      <div class="barra-fila"><span class="et">${et}${ord ? '<span class="lupa">ver</span>' : ""}</span>
        <span class="val">${formato(v)}</span></div>
      <div class="pista"><div class="relleno ${clase}" style="width:${Math.max(2, v/max*100)}%"></div></div>
    </div>`;
  }).join("");
}

function porMes(lista){
  const cuenta = new Map();
  lista.forEach(o => {
    const k = o._f.getFullYear() + "-" + String(o._f.getMonth()+1).padStart(2,"0");
    cuenta.set(k, (cuenta.get(k)||0) + 1);
  });
  const claves = [...cuenta.keys()].sort().slice(-12);
  const max = Math.max(...claves.map(k => cuenta.get(k)), 1);
  return `<div class="meses">${claves.map(k => {
    const [a,m] = k.split("-");
    const v = cuenta.get(k);
    const delMes = lista.filter(o => o._f.getFullYear() == a && o._f.getMonth()+1 == +m);
    return `<div class="mes"${marca(delMes, "Órdenes de " + MES[+m-1] + " " + a)}>
      <span class="vv">${v}</span>
      <div class="col" style="height:${v/max*105}px"></div>
      <span class="lb">${MES[+m-1]}${m==="01"?" "+a.slice(2):""}</span></div>`;
  }).join("")}</div>`;
}

function agrupar(lista, campo, valor){
  const m = new Map();
  lista.forEach(o => {
    const k = (o[campo] || "sin dato").trim() || "sin dato";
    m.set(k, (m.get(k)||0) + (valor ? valor(o) : 1));
  });
  return [...m.entries()].filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
}

/* ---------- exportar ---------- */
const COLS_EXP = [
  ["ot","OT"],["fecha","Fecha"],["equipo","Equipo"],["area","Area"],
  ["interv","Tipo de intervencion"],["prov","Proveedor"],["trabajo","Tipo de trabajo"],
  ["info","Informacion adicional"],["prog","Fecha de programacion"],["semprog","Semana de programacion"],
  ["estado","Estado"],["horom","Horometro"],["tiempo","Tiempo del mantenimiento"],
  ["nmec","Num mecanicos"],["hmec","Horas mtto mecanico"],["naux","Num auxiliares"],
  ["haux","Horas mtto auxiliar"],["fin","Fecha finalizacion"],["semfin","Semana finalizacion"],
  ["dis","Disenos"],["ped","Pedido de materiales"],["lle","Llegada materiales"],
  ["ins","Insumo"],["costo","Costo"],["capturado_por","Capturado por"],["recibido","Recibido"],
];
const DECIMAL = new Set(["horom","tiempo","hmec","haux","costo"]);

function descargarCsv(lista, nombre){
  if(!lista.length){ alert("No hay órdenes para exportar en este período."); return; }
  const esc = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const filas = [COLS_EXP.map(c => c[1]).join(";")];
  lista.forEach(o => filas.push(COLS_EXP.map(([c]) => {
    let v = o[c] ?? "";
    if(DECIMAL.has(c) && v !== "") v = String(v).replace(".", ",");   // Excel en español
    return esc(v);
  }).join(";")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + filas.join("\r\n")],
    {type:"text/csv;charset=utf-8"}));
  a.download = nombre;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

const hoyTexto = () => new Date().toISOString().slice(0,10);

/* ---------- Pareto ----------
   Mismo criterio que la hoja del Excel: barras por equipo ordenadas de mayor
   a menor, línea de porcentaje acumulado y referencia del 80%.             */
let pBase = "ordenes", pTipo = "";

function pareto(lista){
  const base = lista.filter(o => !pTipo || (o.interv||"").toLowerCase().includes(pTipo));
  const m = new Map();
  base.forEach(o => {
    const k = (o.equipo||"sin equipo").trim() || "sin equipo";
    m.set(k, (m.get(k)||0) + (pBase === "horas" ? o._h : 1));
  });
  const todos = [...m.entries()].filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
  if(!todos.length) return `<div class="vacio">No hay datos para ese filtro.</div>`;

  const total = todos.reduce((s,x) => s + x[1], 0);
  let acum = 0;
  const conAcum = todos.map(([e,v]) => { acum += v; return {e, v, pct: acum/total}; });
  const corte = conAcum.findIndex(x => x.pct >= 0.8) + 1;

  const mostrar = conAcum.slice(0, 20);
  const maxV = mostrar[0].v;
  const W = 900, H = 300, ML = 42, MR = 42, MT = 12, MB = 96;
  const ancho = (W - ML - MR) / mostrar.length;
  const y = v => MT + (H - MT - MB) * (1 - v/maxV);
  const yPct = p => MT + (H - MT - MB) * (1 - p);
  const corto = t => t.length > 22 ? t.slice(0,21) + "…" : t;

  const barrasSvg = mostrar.map((d,i) => {
    const x = ML + i*ancho;
    const ord = base.filter(o => ((o.equipo||"sin equipo").trim() || "sin equipo") === d.e);
    return `<g${marca(ord, d.e)}><rect x="${x+ancho*0.14}" y="${y(d.v)}" width="${ancho*0.72}" height="${H-MB-y(d.v)}"
      fill="var(--verde)" rx="2"><title>${d.e}: ${nf(d.v)}</title></rect>
      <text class="ejeTxt" x="${x+ancho/2}" y="${y(d.v)-4}" text-anchor="middle">${nf(d.v)}</text>
      <text class="ejeTxt" x="${x+ancho/2}" y="${H-MB+12}" text-anchor="end"
        transform="rotate(-40 ${x+ancho/2} ${H-MB+12})">${corto(d.e)}</text></g>`;
  }).join("");

  const puntos = mostrar.map((d,i) => `${ML + i*ancho + ancho/2},${yPct(d.pct)}`).join(" ");
  const marcas = mostrar.map((d,i) =>
    `<circle cx="${ML + i*ancho + ancho/2}" cy="${yPct(d.pct)}" r="3" fill="var(--accent)">
       <title>acumulado ${Math.round(d.pct*100)}%</title></circle>`).join("");

  const guias = [0,.25,.5,.75,1].map(p =>
    `<line class="grid" x1="${ML}" x2="${W-MR}" y1="${yPct(p)}" y2="${yPct(p)}"/>
     <text class="ejeTxt" x="${W-MR+5}" y="${yPct(p)+3}">${Math.round(p*100)}%</text>
     <text class="ejeTxt" x="${ML-6}" y="${y(maxV*p)+3}" text-anchor="end">${nf(maxV*p)}</text>`).join("");

  const unidad = pBase === "horas" ? "horas" : "órdenes";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
      ${guias}
      <line x1="${ML}" x2="${W-MR}" y1="${yPct(0.8)}" y2="${yPct(0.8)}"
        stroke="var(--alerta)" stroke-width="1.4" stroke-dasharray="5 4"/>
      <text class="ejeTxt" x="${ML+4}" y="${yPct(0.8)-5}" fill="var(--alerta)">80%</text>
      ${barrasSvg}
      <polyline points="${puntos}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${marcas}
    </svg>
    <div class="resumen80">
      <b>${corte}</b> de ${todos.length} equipos concentran el 80% de ${
        pBase === "horas" ? "las horas" : "las órdenes"}${pTipo ? " de " + pTipo : ""}:
      ${conAcum.slice(0, corte).map(x => x.e).join(", ")}.
      ${todos.length > 20 ? `El gráfico muestra los 20 primeros; el acumulado se calcula sobre los ${todos.length}.` : ""}
      Total del período: ${nf(total)} ${unidad}. Toca una barra para ver esas órdenes.
    </div>`;
}

function pintarPareto(){
  const cont = $("#pareto");
  if(cont){ cont.innerHTML = pareto(todas.filter(enRango)); enlazarBolsas(); }
}

/* ---------- indicadores de gestión ----------
   Solo lo que los datos sostienen. No hay hora de falla ni de puesta en
   marcha, así que no se puede calcular MTTR ni MTBF de verdad; se usan
   sustitutos y se dice cuáles son.                                       */
const DIA = 86400000;

function diasEntre(a, b){ return a && b ? Math.round((b - a)/DIA) : null; }

function indicadores(lista){
  const conAmbas = lista.map(o => ({o, c: aFecha(o.fecha), f: aFecha(o.fin)}))
                        .filter(x => x.c && x.f);
  const cierre = conAmbas.map(x => Math.max(0, diasEntre(x.c, x.f)));
  const medioCierre = cierre.length ? cierre.reduce((a,b)=>a+b,0)/cierre.length : 0;

  const conProg = lista.map(o => ({o, p: aFecha(o.prog), f: aFecha(o.fin)}))
                       .filter(x => x.p && x.f);
  const aTiempo = conProg.filter(x => x.f <= x.p).length;
  const cumplimiento = conProg.length ? aTiempo/conProg.length : null;

  // Pendientes: creadas sin fecha de finalización, con su antigüedad
  const hoy = new Date();
  const pend = todas.filter(o => !o.borrado && !aFecha(o.fin) && aFecha(o.fecha))
                    .map(o => ({o, d: diasEntre(aFecha(o.fecha), hoy)}));
  const tramos = [["Menos de 7 días",0,7],["De 7 a 30",7,30],["De 30 a 90",30,90],["Más de 90",90,1e9]];
  const backlog = tramos.map(([et,a,b]) => [et, pend.filter(x => x.d >= a && x.d < b).length]);

  // Sustituto de MTBF: días promedio entre correctivos del mismo equipo
  const porEquipo = new Map();
  lista.filter(o => (o.interv||"").toLowerCase().includes("correctivo"))
       .forEach(o => {
         const f = aFecha(o.fin) || aFecha(o.fecha); if(!f) return;
         const k = (o.equipo||"").trim(); if(!k) return;
         (porEquipo.get(k) || porEquipo.set(k, []).get(k)).push(f);
       });
  const entre = [];
  porEquipo.forEach((fechas, eq) => {
    if(fechas.length < 3) return;
    fechas.sort((a,b) => a-b);
    let suma = 0;
    for(let i=1;i<fechas.length;i++) suma += diasEntre(fechas[i-1], fechas[i]);
    entre.push({eq, n: fechas.length, dias: suma/(fechas.length-1)});
  });
  entre.sort((a,b) => a.dias - b.dias);

  // Reincidencias: mismo equipo, correctivo, dos veces en menos de 30 días
  const reinc = [];
  porEquipo.forEach((fechas, eq) => {
    fechas.sort((a,b) => a-b);
    let n = 0;
    for(let i=1;i<fechas.length;i++) if(diasEntre(fechas[i-1], fechas[i]) <= 30) n++;
    if(n) reinc.push({eq, n});
  });
  reinc.sort((a,b) => b.n - a.n);

  // Mensual: reparto de horas por tipo y cumplimiento
  const meses = new Map();
  lista.forEach(o => {
    if(!o._f) return;
    const k = o._f.getFullYear() + "-" + String(o._f.getMonth()+1).padStart(2,"0");
    const m = meses.get(k) || {prev:0, corr:0, mej:0, n:0, prog:0, aTiempo:0};
    const t = (o.interv||"").toLowerCase();
    if(t.includes("preventivo")) m.prev += o._h;
    else if(t.includes("correctivo")) m.corr += o._h;
    else m.mej += o._h;
    m.n++;
    const p = aFecha(o.prog), f = aFecha(o.fin);
    if(p && f){ m.prog++; if(f <= p) m.aTiempo++; }
    meses.set(k, m);
  });
  const clavesMes = [...meses.keys()].sort().slice(-12);

  return {medioCierre, cierre, cumplimiento, conProg: conProg.length, pend, backlog,
          entre, reinc, meses, clavesMes};
}

function mesEtiqueta(k){
  const [a,m] = k.split("-");
  return MES[+m-1] + (m === "01" ? " " + a.slice(2) : "");
}

function apiladas(claves, meses){
  const alto = 150;
  const max = Math.max(...claves.map(k => {
    const m = meses.get(k); return m.prev + m.corr + m.mej;
  }), 1);
  const col = k => {
    const m = meses.get(k), tot = m.prev + m.corr + m.mej;
    const h = v => (v/max)*alto;
    return `<div class="mes">
      <span class="vv">${tot ? nf(tot) : ""}</span>
      <div style="width:100%">
        <div style="height:${h(m.mej)}px;background:var(--accent);border-radius:3px 3px 0 0"></div>
        <div style="height:${h(m.corr)}px;background:var(--alerta)"></div>
        <div style="height:${h(m.prev)}px;background:var(--ok)"></div>
      </div>
      <span class="lb">${mesEtiqueta(k)}</span></div>`;
  };
  return `<div class="meses" style="height:${alto+34}px">${claves.map(col).join("")}</div>
    <div style="display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:8px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--ok);border-radius:2px"></span> preventivo</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--alerta);border-radius:2px"></span> correctivo</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px"></span> mejoras</span>
    </div>`;
}

function lineaCumplimiento(claves, meses){
  const W = 720, H = 170, ML = 34, MR = 12, MT = 10, MB = 30;
  const pts = claves.map((k,i) => {
    const m = meses.get(k);
    const v = m.prog ? m.aTiempo/m.prog : null;
    return {x: ML + i*((W-ML-MR)/Math.max(claves.length-1,1)), v, k, n: m.prog};
  });
  const y = v => MT + (H-MT-MB)*(1-v);
  const conDato = pts.filter(p => p.v !== null);
  if(conDato.length < 2) return `<div class="vacio">Faltan fechas programadas para medir esto.</div>`;
  const guias = [0,.5,.8,1].map(v =>
    `<line class="grid" x1="${ML}" x2="${W-MR}" y1="${y(v)}" y2="${y(v)}"
      ${v===0.8?'stroke="#A62B1F" stroke-dasharray="4 4"':''}/>
     <text class="ejeTxt" x="${ML-6}" y="${y(v)+3}" text-anchor="end">${Math.round(v*100)}%</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${guias}
    <polyline points="${conDato.map(p => `${p.x},${y(p.v)}`).join(" ")}"
      fill="none" stroke="var(--verde)" stroke-width="2"/>
    ${conDato.map(p => `<circle cx="${p.x}" cy="${y(p.v)}" r="3.5" fill="var(--verde)">
      <title>${mesEtiqueta(p.k)}: ${Math.round(p.v*100)}% de ${p.n} órdenes programadas</title></circle>`).join("")}
    ${pts.map(p => `<text class="ejeTxt" x="${p.x}" y="${H-10}" text-anchor="middle">${mesEtiqueta(p.k)}</text>`).join("")}
  </svg>`;
}

function pintarIndicadores(){
  const lista = todas.filter(enRango);
  if(!lista.length){ $("#cuerpo").innerHTML = `<div class="vacio">No hay órdenes en este período.</div>`; return; }
  const K = indicadores(lista);
  const viejas = K.pend.filter(x => x.d > 30).length;
  const mediana = K.cierre.length ? K.cierre.slice().sort((a,b)=>a-b)[Math.floor(K.cierre.length/2)] : 0;

  const tarde = lista.filter(o => { const p = aFecha(o.prog), f = aFecha(o.fin); return p && f && f > p; });
  const equiposReinc = new Set(K.reinc.map(r => r.eq));
  const ordsReinc = lista.filter(o => equiposReinc.has((o.equipo||"").trim()) &&
                                      (o.interv||"").toLowerCase().includes("correctivo"));

  $("#cuerpo").innerHTML = `
    <div class="kpis">
      <div class="kpi"${marca(tarde, "Terminadas después de la fecha programada")}>
        <div class="n">${K.cumplimiento === null ? "—" : Math.round(K.cumplimiento*100) + "%"}</div>
        <div class="t">Cumplimiento de lo programado<span class="lupa">ver las tarde</span></div>
        <div class="p">terminadas en la fecha o antes, sobre ${K.conProg} con fecha programada</div></div>
      <div class="kpi"${marca(K.cierre.length ? lista.filter(o => {
          const c = aFecha(o.fecha), f = aFecha(o.fin);
          return c && f && diasEntre(c,f) > 30; }) : [], "Órdenes que tardaron más de 30 días en cerrarse")}>
        <div class="n">${nf(K.medioCierre)}</div>
        <div class="t">Días promedio para cerrar<span class="lupa">ver las lentas</span></div>
        <div class="p">mediana de ${mediana} días, sobre ${K.cierre.length} órdenes</div></div>
      <div class="kpi"${marca(K.pend.map(x => x.o), "Órdenes pendientes sin cerrar")}>
        <div class="n">${K.pend.length}</div>
        <div class="t">Pendientes sin cerrar<span class="lupa">ver</span></div>
        <div class="p">${viejas} llevan más de 30 días</div></div>
      <div class="kpi"${marca(ordsReinc, "Correctivos de los equipos que reinciden")}>
        <div class="n">${K.reinc.reduce((s,r)=>s+r.n,0)}</div>
        <div class="t">Reincidencias<span class="lupa">ver</span></div>
        <div class="p">el mismo equipo, correctivo, dos veces en menos de 30 días</div></div>
    </div>

    <div class="caja"><h2>Reparto de horas por mes</h2>
      ${apiladas(K.clavesMes, K.meses)}
      <p style="font-size:12.5px;color:var(--ink-2);margin:12px 0 0">
        Lo que quieres ver con el tiempo es que la franja verde crezca y la roja baje.</p></div>

    <div class="rejilla">
      <div class="caja"><h2>Cumplimiento mes a mes</h2>${lineaCumplimiento(K.clavesMes, K.meses)}
        <p style="font-size:12.5px;color:var(--ink-2);margin:10px 0 0">
          La línea roja marca el 80%, una meta razonable para empezar.</p></div>

      <div class="caja"><h2>Antigüedad de lo pendiente</h2>
        ${barras(K.backlog.map(b => [b[0], b[1]]), "a", ni, et => {
          const t = {"Menos de 7 días":[0,7],"De 7 a 30":[7,30],"De 30 a 90":[30,90],"Más de 90":[90,1e9]}[et];
          return K.pend.filter(x => x.d >= t[0] && x.d < t[1]).map(x => x.o);
        }, "Pendientes")}
        <p style="font-size:12.5px;color:var(--ink-2);margin:10px 0 0">
          Cuenta desde la fecha de creación hasta hoy, sobre todo el histórico.</p></div>

      <div class="caja"><h2>Equipos que vuelven a fallar más pronto</h2>
        ${K.entre.length ? `<table><thead><tr><th>Equipo</th><th class="n">Correctivos</th>
          <th class="n">Días entre uno y otro</th></tr></thead><tbody>
          ${K.entre.slice(0,10).map(e => {
            const ord = lista.filter(o => (o.equipo||"").trim() === e.eq &&
              (o.interv||"").toLowerCase().includes("correctivo"));
            return `<tr${marca(ord, "Correctivos de " + e.eq)}><td>${e.eq}<span class="lupa">ver</span></td>
              <td class="n">${e.n}</td><td class="n">${nf(e.dias)}</td></tr>`;
          }).join("")}</tbody></table>`
          : `<div class="vacio">Ningún equipo tiene tres o más correctivos en el período.</div>`}
        <p style="font-size:12.5px;color:var(--ink-2);margin:10px 0 0">
          Sustituto del MTBF: promedio de días entre correctivos, para equipos con tres o más.
          Entre menos días, más candidato a un preventivo.</p></div>

      <div class="caja"><h2>Reincidencias por equipo</h2>
        ${K.reinc.length ? barras(K.reinc.slice(0,10).map(r => [r.eq, r.n]), "", ni,
            eq => lista.filter(o => (o.equipo||"").trim() === eq &&
              (o.interv||"").toLowerCase().includes("correctivo")), "Correctivos de")
          : `<div class="vacio">Sin reincidencias en el período.</div>`}
        <p style="font-size:12.5px;color:var(--ink-2);margin:10px 0 0">
          Veces que un equipo volvió a fallar dentro de los 30 días siguientes.
          Suele señalar reparaciones que no atacaron la causa.</p></div>
    </div>

    <p style="font-size:12.5px;color:var(--ink-2);margin:16px 0 0">
      Sobre qué se puede medir y qué no: no hay hora de falla ni de puesta en marcha,
      así que estos no son MTTR ni MTBF en sentido estricto. Los días para cerrar se
      cuentan de la creación de la orden a su finalización, y el tiempo entre fallas es
      el promedio entre correctivos consecutivos del mismo equipo. Sirven para comparar
      meses y equipos entre sí, no para reportar a una norma.</p>`;
}

/* ---------- pintado ---------- */
let vista = "resumen";
function pintar(){
  bolsas = new Map(); nBolsa = 0;
  $("#periodo").textContent = desde
    ? `${desde.toLocaleDateString("es-CO")} a ${hasta.toLocaleDateString("es-CO")}`
    : "histórico completo";
  if(vista === "indic"){ pintarIndicadores(); } else { pintarResumen(); }
  enlazarBolsas();
}

function pintarResumen(){
  const lista = todas.filter(enRango);
  const abiertas = todas.filter(o => o.lista === false && !o.consolidado).length;
  const horas = lista.reduce((s,o) => s + o._h, 0);
  const prev = lista.filter(o => (o.interv||"").toLowerCase().includes("preventivo"))
                    .reduce((s,o) => s + o._h, 0);
  const corr = lista.filter(o => (o.interv||"").toLowerCase().includes("correctivo"))
                    .reduce((s,o) => s + o._h, 0);
  const conHoras = lista.filter(o => o._h > 0).length;

  if(!lista.length){
    $("#cuerpo").innerHTML = `<div class="vacio">No hay órdenes en este período.</div>`;
    return;
  }

  const equipos = agrupar(lista, "equipo", o => o._h).slice(0,10);
  const areas = agrupar(lista, "area", o => o._h).slice(0,8);
  const tipos = agrupar(lista, "interv", o => o._h);
  const estados = agrupar(lista, "estado");
  const personas = agrupar(lista, "capturado_por");
  const porCampo = campo => et => lista.filter(o => ((o[campo]||"sin dato").trim() || "sin dato") === et);

  $("#cuerpo").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="n">${ni(lista.length)}</div><div class="t">Órdenes</div>
        <div class="p">${conHoras} con horas registradas</div></div>
      <div class="kpi"><div class="n">${nf(horas)}</div><div class="t">Horas de mantenimiento</div>
        <div class="p">${nf(horas/Math.max(conHoras,1))} h por orden</div></div>
      <div class="kpi"><div class="n">${horas ? Math.round(prev/horas*100) : 0}%</div>
        <div class="t">Horas en preventivo</div>
        <div class="p">${Math.round(corr/Math.max(horas,1)*100)}% en correctivo</div></div>
      <div class="kpi"><div class="n">${abiertas}</div><div class="t">Abiertas ahora</div>
        <div class="p">trabajos sin terminar</div></div>
    </div>

    <div class="caja"><h2>Órdenes por mes</h2>${porMes(lista)}</div>

    <div class="caja ancha"><h2>Pareto de equipos</h2>
      <div class="ctrl">
        <span class="et">Medido en</span>
        <select id="p_base">
          <option value="ordenes">número de órdenes</option>
          <option value="horas">horas de mantenimiento</option>
        </select>
        <span class="et">Intervención</span>
        <select id="p_tipo">
          <option value="">todas</option>
          <option value="correctivo">solo correctivo</option>
          <option value="preventivo">solo preventivo</option>
          <option value="mejora">solo mejoras</option>
        </select>
      </div>
      <div id="pareto"></div>
    </div>

    <div class="rejilla">
      <div class="caja"><h2>Horas por tipo de intervención</h2>
        ${barras(tipos,"",nf,porCampo("interv"),"Intervención")}</div>
      <div class="caja"><h2>Órdenes por estado</h2>
        ${barras(estados,"a",ni,porCampo("estado"),"Estado")}</div>
      <div class="caja"><h2>Los 10 equipos con más horas</h2>
        ${barras(equipos,"s",nf,porCampo("equipo"))}</div>
      <div class="caja"><h2>Horas por área</h2>
        ${barras(areas,"s",nf,porCampo("area"),"Área")}</div>
    </div>

    <div class="caja"><h2>Últimas órdenes registradas</h2>
      <table><thead><tr><th class="n">OT</th><th>Fecha</th><th>Equipo</th>
        <th>Intervención</th><th>Estado</th><th class="n">Horas</th></tr></thead>
        <tbody>${lista.slice().sort((a,b)=>b.ot-a.ot).slice(0,12).map(o=>`
          <tr><td class="n">${o.ot}</td><td>${o.fecha||""}</td><td>${o.equipo||""}</td>
          <td>${o.interv||""}</td><td>${o.estado||""}</td><td class="n">${o._h?nf(o._h):""}</td></tr>`).join("")}
        </tbody></table></div>

    ${personas.length > 1 ? `<div class="caja"><h2>Quién registró</h2>
      ${barras(personas,"a",ni,porCampo("capturado_por"))}</div>` : ""}

    <p style="font-size:12.5px;color:var(--ink-2);margin:16px 0 0" id="notaFinal">
      Las órdenes se ubican en el tiempo por su fecha de finalización, y si no la tienen,
      por la de creación. Las horas salen del campo de duración: ${lista.length - conHoras}
      de estas órdenes no lo tienen y por eso suman cero.</p>`;

  $("#p_base").value = pBase; $("#p_tipo").value = pTipo;
  $("#p_base").onchange = e => { pBase = e.target.value; pintarPareto(); };
  $("#p_tipo").onchange = e => { pTipo = e.target.value; pintarPareto(); };
  pintarPareto();
}

/* ---------- filtros ---------- */
function aplicarRango(dias){
  rangoActivo = dias;
  if(dias === 0){ desde = null; hasta = null; $("#f_desde").value = ""; $("#f_hasta").value = ""; }
  else{
    hasta = new Date(); hasta.setHours(23,59,59);
    desde = new Date(); desde.setDate(desde.getDate() - dias); desde.setHours(0,0,0);
    $("#f_desde").value = iso(desde); $("#f_hasta").value = iso(hasta);
  }
  document.querySelectorAll("[data-rango]").forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.rango === dias)));
  pintar();
}

function arrancar(){
  document.querySelectorAll("[data-rango]").forEach(b =>
    b.onclick = () => aplicarRango(+b.dataset.rango));
  const manual = () => {
    const d = $("#f_desde").value, h = $("#f_hasta").value;
    desde = d ? new Date(d + "T00:00:00") : null;
    hasta = h ? new Date(h + "T23:59:59") : null;
    document.querySelectorAll("[data-rango]").forEach(b => b.setAttribute("aria-pressed","false"));
    pintar();
  };
  $("#f_desde").onchange = manual; $("#f_hasta").onchange = manual;
  $("#btnRecargar").onclick = traer;
  $("#modalCerrar").onclick = cerrarModal;
  $("#modal").onclick = e => { if(e.target.id === "modal") cerrarModal(); };
  document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarModal(); });
  $("#v_resumen").onclick = () => { vista = "resumen";
    $("#v_resumen").setAttribute("aria-pressed","true"); $("#v_indic").setAttribute("aria-pressed","false"); pintar(); };
  $("#v_indic").onclick = () => { vista = "indic";
    $("#v_resumen").setAttribute("aria-pressed","false"); $("#v_indic").setAttribute("aria-pressed","true"); pintar(); };
  $("#btnExpPeriodo").onclick = () => {
    const lista = todas.filter(enRango).sort((a,b) => a.ot - b.ot);
    const etiqueta = desde ? `${iso(desde)}_a_${iso(hasta)}` : "historico";
    descargarCsv(lista, `ordenes_${etiqueta}.csv`);
  };
  $("#btnExpTodo").onclick = () => {
    descargarCsv(todas.slice().sort((a,b) => a.ot - b.ot), `respaldo_ordenes_${hoyTexto()}.csv`);
  };
  aplicarRango(365);
  traer();
}

if(acceso()) arrancar();
</script>
